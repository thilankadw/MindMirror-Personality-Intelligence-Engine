[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmirror-personality"
version = "0.1.0"
description = "Personality inference component for MindMirror with Reddit-based Big Five prediction pipelines and API support"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "gunicorn==21.2.0",
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "python-multipart==0.0.9",
  "sqlalchemy>=1.4.28,<2.0",
  "psycopg2-binary==2.9.9",
  "alembic==1.13.1",
  "asyncpg==0.29.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "httpx==0.27.0",
  "requests==2.32.3",
  "praw==7.8.1",
  "python-json-logger==2.0.7",
  "sentry-sdk==1.40.6",
  "python-dotenv==1.0.1",
  "email-validator>=1.0.5,<2",
  "numpy>=1.26.4,<2.0.0",
  "pandas>=2.2.2,<2.3.0",
  "scikit-learn>=1.5.2,<1.6.0",
  "joblib>=1.4.2,<1.6.0",
  "xgboost==1.7.6",
  "scipy>=1.11.4,<1.15.0",
  "mlflow==2.13.0",
  "setuptools==67.8.0",
  "demoji>=1.1.0,<2.0.0",
  "nltk>=3.9,<4.0.0",
  "textblob>=0.18.0.post0,<1.0.0",
  "torch>=2.5.1,<2.7.0",
  "transformers>=4.44.0,<5.0.0",
  "seaborn>=0.13.2,<0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.1.1",
  "pytest-asyncio==0.23.6",
  "ruff==0.3.2",
  "mypy==1.9.0",
  "pre-commit==3.6.2",
]
mlflow = [
  "mlflow==2.13.0",
]
inference = [
  "mlflow==2.13.0",
]

[project.scripts]
mindmirror-personality = "api.app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "src*", "shared*"]
